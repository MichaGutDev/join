<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join</title>
    <link rel="stylesheet" href="styles/fonts.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="styles/buttons.css">
    <link rel="stylesheet" href="styles/auth.css">
</head>

<body class="login-body">
    <header class="login-header">
        <div class="login-header-content">
            <img src="./assets/icons/login-icon.svg" alt="Join Icon" class="login-icon">
            <div class="login-header-right">
                <p>Not a Join User?</p>
                <button class="btn btn-primary">Sign Up</button>
            </div>
        </div>
    </header>

    <main class="login-main">
        <form class="login-card" onsubmit="login()" novalidate>
            <h1>Log in</h1>
            <label for="email">
                <span class="visually-hidden">Required field: Email address</span>
                <input type="email" required id="email" placeholder="Email">
                <img src="./assets/icons/mail-icon.svg" alt="Mail Icon">
            </label>
            <label for="password">
                <span class="visually-hidden">Required field: password</span>
                <input type="password" required id="password" placeholder="Password">
                <img src="./assets/icons/lock-icon.svg" alt="Lock Icon">
            </label>
            <button class="btn btn-primary" type="submit">Log in</button>
            <button class="btn btn-secondary" type="button">Guest Log in</button>
        </form>



    </main>

    <footer class="login-footer">
        <a href="#">Privacy Policy</a>
        <a href="#">Legal notice</a>
    </footer>

    <script src="script.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
