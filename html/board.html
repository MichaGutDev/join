<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../styles/board.css">
    <link rel="shortcut icon" href="../assets/icons/favicon.svg" type="image/x-icon">
</head>

<body>
    <aside>
        <div class="aside-join-icon">
            <img src="../assets/icons/main-icon.svg" alt="">

        </div>


        <nav class="sidebar-nav">
            <a href="#" class="nav-item">
                <img src="../assets/icons/summary-icon.svg" alt="">
                <span>Summary</span>
            </a>

            <a href="#" class="nav-item ">
                <img src="../assets/icons/add-task-icon.svg" alt="">
                <span>Add Task</span>
            </a>

            <a href="#" class="nav-item active">
                <img src="../assets/icons/board-icon.svg" alt="">
                <span>Board</span>
            </a>

            <a href="#" class="nav-item">
                <img src="../assets/icons/contacts-icon.svg" alt="">
                <span>Contacts</span>
            </a>
        </nav>
    </aside>

    <main>
        <header class="header">
            <h2 class="header-title">Kanban Project Management Tool</h2>

            <div class="header-actions">
                <button class="help-button" aria-label="Help">
                    <img src="../assets/icons/help-questionmark-icon.svg" alt="">
                </button>

                <button class="user-avatar" aria-label="Open user menu">
                    <span id="userInitials">SM</span>
                </button>
            </div>
        </header>

        <div class="board-wrapper">
            <section class="task-col">
                <ul id="to_do">
                    <li class="task-box">
                        <h3>User Story</h3>
                        <h4>Kochwelt Page</h4>
                        <span>build start page with recipe</span>


                        <div class="subtask-progress-container">
                            <div class="progress-bar">

                            </div>
                            <span>1/2Subtasks</span>
                        </div>


                        <div class="initials-container">
                            <div class="user-avatar">RB</div>
                            <img src="../assets/icons/prio-high.svg" alt="high-priority icon">

                        </div>

                    </li>

                    <li class="task-box">
                        <h3>User Story</h3>
                        <h4>Kochwelt Page</h4>
                        <span>build start page with recipe</span>
                        <div class="subtask-progress-container">
                            <div class="progress-bar">

                            </div>
                            <span>1/2Subtasks</span>
                        </div>
                        <div>
                            <div class="initials-container">
                                <div class="user-avatar">RB</div>
                            </div>
                            <div class="placeholder for image urgent"></div>
                        </div>
                    </li>
                </ul>
            </section>

            <section class="task-col">
                <ul id="in_progress">
                    <li></li>
                </ul>
            </section>

            <section class="task-col">
                <ul id="await_feedback">
                    <li></li>
                </ul>
            </section>

            <section class="task-col">
                <ul id="done">
                    <li></li>
                </ul>
            </section>
        </div>




        <!-- <section>
            <h3>User Story</h3>

            <p>Description</p>
            <div>
                <div>LoadingBar</div>
                <span>subtasks</span>
            </div>
            <div>
                <div>
                    <div>RB</div>
                    <div>MG</div>
                    <div>SO</div>
                </div>
                <div>Urgency</div>
            </div>

        </section> -->

    </main>

    <script src="../script.js"></script>
    <script src="../js/add_task.js"></script>

    <script type="module" src="../js/firebase-config.js"></script>

</body>


</html>
